<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    {% seo %}
  </head>
  <body class="{% if page.url == '/' %}home{% else %}interior{% endif %}">
    <nav class="topbar">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <ul>
        <li><a href="{{ '/' | relative_url }}#contents">Index</a></li>
        <li><a href="{{ '/about/' | relative_url }}">About</a></li>
        <li><a href="https://github.com/tangjiahui" target="_blank" rel="noopener">GitHub</a></li>
        <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
      </ul>
    </nav>
    {{ content }}
  </body>
</html>
