---
layout: default
---
<article class="page interior-shell">
  <header class="page-header">
    <p class="kicker">— {{ page.title }}</p>
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="page-body">
    {{ content }}
  </div>
</article>
