---
layout: default
---
<article class="entry standalone">
  <header class="entry-head">
    <p class="entry-meta">{{ page.title }}</p>
    <h1 class="entry-title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="entry-subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="entry-body">
    {{ content }}
  </div>
</article>
