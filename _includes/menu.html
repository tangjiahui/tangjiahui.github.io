<details class="menu">
  <summary aria-label="Open menu">
    <span class="dingbat" aria-hidden="true">︎</span>
  </summary>
  <div class="menu-panel">
    <p class="menu-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
    {% if site.tagline %}<p class="menu-tag">{{ site.tagline }}</p>{% endif %}

    <ul class="menu-list">
      <li><a href="{{ '/' | relative_url }}">Index</a></li>
      <li><a href="{{ '/about/' | relative_url }}">About</a></li>
      <li><a href="https://github.com/tangjiahui" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
    </ul>

    {% if site.posts.size > 0 %}
      <p class="menu-section">Writing</p>
      <ul class="menu-list">
        {% for post in site.posts %}
          <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
        {% endfor %}
      </ul>
    {% endif %}
  </div>
</details>
